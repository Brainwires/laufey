# TEMPORARY: measures the CEF macOS crash at the end of a quick relaunch
# (storage stress) and symbolizes its crash reports. To be removed before this
# branch is offered.
name: diag-relaunch-crash
on:
  push:
    branches: [fix/cef-macos-relaunch-crash]
    paths: [.github/workflows/diag-relaunch-crash.yml, .github/diag-trigger]
permissions:
  contents: read
jobs:
  loop:
    name: loop / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15-intel, cefarch: macosx64, arch: x86_64 }
          - { os: macos-15, cefarch: macosarm64, arch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.99.1
      - run: brew install llvm ninja
      - name: Cache CEF
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/cef
          key: cef-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
      - run: make cef
      - run: cargo build --release -p storage_e2e_runtime
      - name: Clear old crash reports
        run: rm -f ~/Library/Logs/DiagnosticReports/*.ips || true
      - name: Loop the storage stress
        timeout-minutes: 55
        shell: bash
        env:
          LAUFEY_E2E_STRESS_SCHEME: lsstress
        run: |
          end=$(( $(date +%s) + ${DIAG_MINUTES:-44}*60 ))
          rounds=0
          while [ "$(date +%s)" -lt "$end" ]; do
            rounds=$((rounds+1))
            scripts/storage-stress-e2e-run.sh cef 100 </dev/null > "round-$rounds.log" 2>&1 || true
            grep -E '^\[stress-e2e\] (FAIL|[0-9]+ launches)' "round-$rounds.log" | cut -c1-300 || true
          done
          echo "== totals over $rounds rounds:"
          cat round-*.log | grep -E '^\[stress-e2e\] [0-9]+ launches' |
            awk '{n+=$2; lost+=$7; other+=$14; hung+=$17} END {print "launches", n, "lost", lost, "other", other, "hung", hung}'
          echo "segfaults: $(cat round-*.log | grep -c 'Segmentation fault' || true)"
          echo "exit codes: $(cat round-*.log | grep -oE 'FAIL #[0-9]+: the launch \(exit [0-9]+' | grep -oE 'exit [0-9]+' | sort | uniq -c | tr '\n' ' ')"
      - name: Crash reports
        if: always()
        shell: bash
        run: |
          sleep 20
          mkdir -p crash
          cp ~/Library/Logs/DiagnosticReports/*.ips crash/ 2>/dev/null || true
          ls -la crash
          for f in crash/*.ips; do [ -f "$f" ] && python3 scripts/print-crash-report.py "$f" | head -80; done || true
      - name: Symbolize CEF frames
        if: always()
        shell: bash
        run: |
          ls crash/*.ips >/dev/null 2>&1 || { echo "no crash reports"; exit 0; }
          v="$(sed -n 's/^CEF_FULL_VERSION := //p' Makefile)"
          url="https://cef-builds.spotifycdn.com/cef_binary_${v//+/%2B}_${{ matrix.cefarch }}_release_symbols.tar.bz2"
          echo "$url"
          mkdir -p syms
          curl -fsSL --retry 5 "$url" -o syms/s.tar.bz2 || { echo "no symbols download"; exit 0; }
          tar xjf syms/s.tar.bz2 -C syms
          dwarf="$(find syms -path '*Chromium Embedded Framework.dSYM/Contents/Resources/DWARF/*' -type f | head -1)"
          echo "dwarf: $dwarf"
          for f in crash/*.ips; do
            python3 scripts/diag-symbolize-ips.py "$f" "$dwarf" ${{ matrix.arch }} || true
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: diag-${{ matrix.os }}
          path: |
            crash/
            round-*.log
